name: velune-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.38.1@sha256:0df9bc14142000b161344bd24caf6ddd319b7319055aedaf9b0692b125730af7
    restart: unless-stopped
    cpus: 2
    mem_limit: 4g
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:30300:3000"
      - "127.0.0.1:34317:4317"
    volumes:
      - data:/data
    environment:
      LGTM_SHUTDOWN_TIMEOUT_SECONDS: "40"
      ENABLE_OBI: "false"
      ENABLE_LOGS_ALL: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?private.env is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=3d --storage.tsdb.retention.size=2GB"
      LOKI_EXTRA_ARGS: "-store.retention=72h -compactor.retention-enabled=true -compactor.delete-request-store=filesystem -reporting.enabled=false"
      TEMPO_EXTRA_ARGS: "-backend-scheduler.provider.work.compaction.block-retention=72h -backend-worker.compaction.block-retention=72h -reporting.enabled=false"
      PYROSCOPE_EXTRA_ARGS: "-retention-period=72h -usage-stats.enabled=false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
