[package]
name = "velune-remote"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
velune-application-api = { path = "../application-api" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.4"
sha2 = "=0.10.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
