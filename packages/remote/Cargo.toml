[package]
name = "velune-remote"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Synthetic transport marker protocol, excluded from normal product assembly.
diagnostics = ["dep:iroh-mdns-address-lookup"]

[dependencies]
velune-application-api = { path = "../application-api" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
# Fixed upstream cache replacement; package version alone still denotes 0.6.0.
iroh-mdns-address-lookup = { git = "https://github.com/n0-computer/iroh-address-lookups", rev = "6f103e7a92ddbd2007383527ab5024c983e3c1c6", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.4"
sha2 = "=0.10.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }
