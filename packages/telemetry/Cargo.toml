[package]
name = "velune-telemetry"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
getrandom = "0.4"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "json"] }
tracing-appender = "0.2"
tracing-opentelemetry = "=0.33.0"
opentelemetry = "=0.32.0"
opentelemetry_sdk = "=0.32.0"
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "=0.32.0"
opentelemetry-proto = { version = "=0.32.0", features = ["gen-tonic", "trace", "logs", "metrics"] }
tonic = { version = "0.14", features = ["tls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
