[package]
name = "velune-ai-provider"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
velune-ai = { path = "../ai" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "system-proxy"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
eventsource-stream = "0.2"
tokio = { version = "1", features = ["process", "io-util", "net", "sync", "time", "rt", "macros"] }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
getrandom = "0.4"
sha2 = "=0.10.9"
uuid = { version = "1", features = ["v4", "serde"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["process"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
