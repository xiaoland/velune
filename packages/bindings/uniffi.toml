[bindings.swift]
module_name = "VeluneBindings"
ffi_module_name = "VeluneBindingsFFI"
generate_codable_conformance = true

[bindings.kotlin]
package_name = "app.velune.bindings"
android = true

[bindings.csharp]
namespace = "Velune.Bindings"

# A variant field named like a sibling variant collides with that variant's
# nested record in C#; use the generator's own `Value` suffix for it.
[bindings.csharp.rename.velune_bindings]
"BindingMessageBlock.Reasoning.text" = "text_value"
"BindingMessageBlock.Notice.text" = "text_value"
"BindingResourceTemplateContent.Subagent.instructions" = "instructions_value"
