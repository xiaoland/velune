[package]
name = "velune-bindings"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["local-runtime", "remote", "external-control"]
local-runtime = ["dep:velune-application", "dep:tracing-subscriber", "dep:tracing-appender"]
remote = ["dep:velune-remote", "dep:tokio", "dep:jni", "dep:rustls-platform-verifier"]
remote-diagnostics = ["remote", "velune-remote/diagnostics", "dep:tracing-subscriber"]
external-control = ["local-runtime", "remote", "dep:axum", "dep:base64", "dep:futures-util", "dep:getrandom", "dep:hmac", "dep:sha2", "dep:subtle"]

[dependencies]
velune-telemetry = { path = "../telemetry" }
velune-application = { path = "../application", optional = true }
velune-application-api = { path = "../application-api" }
velune-remote = { path = "../remote", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"], optional = true }
uniffi = "=0.32.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry"], optional = true }
tracing-appender = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
getrandom = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "=0.10.9", optional = true }
subtle = { version = "2", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", optional = true }
rustls-platform-verifier = { version = "=0.7.1", optional = true }

[dev-dependencies]
velune-test-support = { path = "../test-support" }
