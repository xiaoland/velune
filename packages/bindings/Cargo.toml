[package]
name = "velune-bindings"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["local-runtime", "remote"]
local-runtime = ["dep:velune-application", "velune-application/local-runtime", "dep:tracing-subscriber", "dep:tracing-appender"]
remote = ["dep:velune-remote", "dep:tokio"]
cli = ["uniffi/cli"]

[[bin]]
name = "velune-bindgen"
path = "src/bin.rs"
required-features = ["cli"]

[dependencies]
velune-application = { path = "../application", default-features = false, optional = true }
velune-application-api = { path = "../application-api" }
velune-remote = { path = "../remote", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"], optional = true }
uniffi = "=0.32.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry"], optional = true }
tracing-appender = { version = "0.2", optional = true }
