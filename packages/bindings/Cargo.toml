[package]
name = "velune-bindings"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["local-runtime"]
local-runtime = ["velune-application/local-runtime"]
cli = ["uniffi/cli"]

[[bin]]
name = "velune-bindgen"
path = "src/bin.rs"
required-features = ["cli"]

[dependencies]
velune-application = { path = "../application", default-features = false }
uniffi = "=0.32.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry"] }
tracing-appender = "0.2"
