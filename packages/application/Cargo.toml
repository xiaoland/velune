[package]
name = "velune-application"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["local-runtime"]
local-runtime = ["dep:velune-agent-runtime", "dep:velune-gateway", "dep:sha2", "dep:tokio", "dep:rustix"]

[dependencies]
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = { version = "=0.10.9", optional = true }
velune-conversation = { path = "../conversation" }
velune-agent-runtime = { path = "../agent-runtime", optional = true }
velune-gateway = { path = "../gateway", optional = true }

tokio = { version = "1", optional = true, features = ["process", "io-util", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", optional = true, features = ["process"] }
