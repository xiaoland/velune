[package]
name = "velune-application"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["local-runtime"]
local-runtime = ["dep:velune-agent-runtime", "dep:sha2", "dep:rustix", "tokio/process", "tokio/io-util"]

[dependencies]
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", optional = true }
velune-conversation = { path = "../conversation" }
velune-agent-runtime = { path = "../agent-runtime", optional = true }
velune-gateway = { path = "../gateway" }

tokio = { version = "1", features = ["rt", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy", "stream"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", optional = true, features = ["process"] }
