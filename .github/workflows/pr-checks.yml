name: PR checks

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Detect changed Rust owners
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          git diff --check "$BASE_SHA...HEAD"
          python3 - "$BASE_SHA" "$GITHUB_OUTPUT" <<'PY'
          import subprocess,sys
          base,output=sys.argv[1:]
          names=subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'],text=True).splitlines()
          rust_files={'Cargo.lock','Cargo.toml','rust-toolchain.toml','clippy.toml','.cargo/config.toml','.github/workflows/pr-checks.yml'}
          rust=any(
              name.endswith('.rs') or name in rust_files or name.endswith('/Cargo.toml')
              or name.startswith('packages/ai-provider/relaykit-bridge/')
              for name in names
          )
          with open(output,'a') as stream:
              stream.write(f'rust={str(rust).lower()}\n')
          PY
      - name: Validate release metadata
        run: |
          set -euo pipefail
          python3 scripts/version.py --format build-info
          python3 -m py_compile scripts/version.py scripts/package-release.py scripts/release-run.py scripts/release-notes.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('release-please-config.json').read_text())
          manifest = json.loads(Path('.release-please-manifest.json').read_text())
          package = config['packages']['.']
          assert package['release-type'] == 'simple'
          assert package['versioning'] == 'prerelease'
          assert package['prerelease'] is True and package['draft'] is True
          assert package['bump-minor-pre-major'] is True
          assert package['force-tag-creation'] is True
          assert isinstance(manifest['.'], str) and manifest['.']
          PY
      - name: Check shell syntax and whitespace
        run: |
          set -euo pipefail
          bash -n scripts/build-macos.sh scripts/build-ios.sh scripts/build-ios-native.sh scripts/build-android.sh scripts/build-android-native.sh
      - name: Set up Node for the runtime helper checks
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Run the synthetic script checks
        run: |
          set -euo pipefail
          for check in build-cache build-support claude-history composer-migration runtime-start-policy \
                       service-tier-migration macos-dev; do
            python3 "scripts/check-$check.py"
          done
          for check in pi-background-work pi-subagent-metadata runtime-background-tasks; do
            node "scripts/check-$check.mjs"
          done
          python3 -B tests/acceptance/test_runner.py
      - name: Set up Go for the Linux RelayKit link prerequisite
        if: steps.changes.outputs.rust == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - name: Cache Linux Rust build inputs
        if: steps.changes.outputs.rust == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/host-rust
          key: pr-linux-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check Rust formatting
        if: steps.changes.outputs.rust == 'true'
        run: cargo fmt --all --check
      - name: Lint the Rust workspace and bindings feature sets
        if: steps.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo clippy --locked -p velune-bindings --no-default-features --all-targets -- -D warnings
          cargo clippy --locked -p velune-bindings --no-default-features --features remote --all-targets -- -D warnings
      - name: Keep the remote-only bindings free of local runtime crates
        if: steps.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -p velune-bindings --no-default-features --features remote -e normal --prefix none)
          if forbidden=$(grep -E '^velune-(application|agent-runtime|gateway|ai-provider) ' <<<"$tree"); then
            echo "::error::remote-only velune-bindings depends on local runtime crates:"
            echo "$forbidden"
            exit 1
          fi
      - name: Link the shared Rust core and bindings on Linux
        if: steps.changes.outputs.rust == 'true'
        run: cargo build --locked --package velune-bindings --lib
      - name: Run the Rust workspace tests
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 30
        run: cargo test --locked --workspace --no-fail-fast
