name: PR native consumers

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: native-consumers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select native consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apple: ${{ steps.inputs.outputs.apple }}
      android: ${{ steps.inputs.outputs.android }}
      windows: ${{ steps.inputs.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check input selection and compare the merge candidate
        id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 -B scripts/check-native-pr-inputs.py
          python3 -B scripts/native-pr-inputs.py "$BASE_SHA" >> "$GITHUB_OUTPUT"

  apple:
    name: Compile ${{ matrix.platform }} consumer
    needs: changes
    if: needs.changes.outputs.apple != '[]'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.changes.outputs.apple) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Xcode
        run: xcodebuild -version
      - uses: actions/setup-go@v5
        if: matrix.platform == 'macos'
        with:
          go-version-file: packages/ai-provider/relaykit-bridge/go.mod
          cache-dependency-path: packages/ai-provider/relaykit-bridge/go.sum
      - uses: actions/setup-node@v4
        if: matrix.platform == 'macos'
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: packages/agent-runtime/runtime-support/package-lock.json
      - name: Build Mac with generated Swift bindings
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          bash scripts/install-runtime-support.sh
          bash scripts/install-xurl.sh
          bash scripts/build-macos.sh --profile dev --build-only
      - name: Build iOS with generated remote-only Swift bindings
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios-sim
          bash scripts/build-ios.sh iphonesimulator --profile dev -onlyUsePackageVersionsFromResolvedFile

  android:
    name: Compile Android consumer
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
      - name: Build Android with generated remote-only Kotlin bindings
        env:
          ANDROID_NDK_VERSION: '30.0.14904198'
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          rustup target add aarch64-linux-android
          bash scripts/build-android.sh --profile dev

  windows:
    name: Compile Windows consumer
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/ai-provider/relaykit-bridge/go.mod
          cache-dependency-path: packages/ai-provider/relaykit-bridge/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: packages/agent-runtime/runtime-support/package-lock.json
      - name: Install the RelayKit C compiler
        shell: pwsh
        run: |
          $revision = '20261117'
          $directory = "llvm-mingw-$revision-ucrt-x86_64"
          $archive = Join-Path $env:RUNNER_TEMP "$directory.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$revision/$directory.zip" -OutFile $archive
          $sha256 = '4d002e330a0f703625aa5ccbc37e96f8f824413e163bfc7336774aabd2c3a412'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $sha256) {
              throw 'llvm-mingw archive SHA-256 mismatch'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "$directory/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install runtime support
        shell: bash
        run: bash scripts/install-runtime-support.sh
      - name: Build WinUI with generated C# bindings
        shell: powershell
        run: |
          .\scripts\install-xurl.ps1
          .\scripts\build-windows.ps1 -Profile dev

  result:
    name: native consumers
    needs: [changes, apple, android, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      INPUTS_RESULT: ${{ needs.changes.result }}
      APPLE_INPUTS: ${{ needs.changes.outputs.apple }}
      APPLE_RESULT: ${{ needs.apple.result }}
      ANDROID_INPUTS: ${{ needs.changes.outputs.android }}
      ANDROID_RESULT: ${{ needs.android.result }}
      WINDOWS_INPUTS: ${{ needs.changes.outputs.windows }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
    steps:
      - name: Require the selected builds
        run: |
          set -euo pipefail
          [[ "$INPUTS_RESULT" == success ]]
          check() {
            local platform="$1" selected="$2" result="$3"
            printf '%s: selected=%s, result=%s\n' "$platform" "$selected" "$result"
            if [[ "$selected" == true ]]; then
              [[ "$result" == success ]]
            else
              [[ "$result" == skipped ]]
            fi
          }
          apple_selected=false
          [[ "$APPLE_INPUTS" == '[]' ]] || apple_selected=true
          check Apple "$apple_selected" "$APPLE_RESULT"
          check Android "$ANDROID_INPUTS" "$ANDROID_RESULT"
          check Windows "$WINDOWS_INPUTS" "$WINDOWS_RESULT"
