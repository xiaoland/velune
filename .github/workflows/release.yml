name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to retry, for example v0.1.0-beta.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: velune-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'xiaoland/velune'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.identity.outputs.publish || steps.retry.outputs.publish }}
      tag: ${{ steps.identity.outputs.tag || steps.retry.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha || steps.retry.outputs.sha }}
      version: ${{ steps.identity.outputs.version || steps.retry.outputs.version }}
      build_number: ${{ steps.identity.outputs.build_number || steps.retry.outputs.build_number }}
      matrix: ${{ steps.assets.outputs.matrix }}
      source_platforms: ${{ steps.assets.outputs.source_platforms }}
      android_certificate: ${{ steps.assets.outputs.android_certificate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read public release asset contract
        id: assets
        run: |
          python3 -B scripts/check-release-assets.py
          python3 scripts/release_assets.py workflow-outputs >> "$GITHUB_OUTPUT"
      - name: Create release PR or release tag
        id: release_please
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
      - name: Create and record release build identity
        id: identity
        if: github.event_name == 'push' && steps.release_please.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release_please.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release_please.outputs.sha }}
          RELEASE_VERSION: ${{ steps.release_please.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]]
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$RELEASE_SHA" ]]
          [[ "$(python3 scripts/version.py --format full)" == "$RELEASE_VERSION" ]]
          python3 scripts/release-run.py write \
            --tag "$RELEASE_TAG" --commit "$RELEASE_SHA" \
            --build-number "$RUN_NUMBER" --run-id "$RUN_ID" --run-number "$RUN_NUMBER" \
            --output target/release-build.json
          mkdir -p target/release
          cp target/release-build.json target/release/release-build.json
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          gh release upload "$RELEASE_TAG" target/release/release-build.json --clobber
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Load original release identity for a same-tag retry
        id: retry
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          mkdir -p target/retry
          gh release download "$RELEASE_TAG" --pattern release-build.json --dir target/retry
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"
          metadata=$(python3 scripts/release-run.py verify --metadata target/retry/release-build.json --tag "$RELEASE_TAG")
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .source_commit <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "build_number=$(jq -r .build_number <<<"$metadata")" >> "$GITHUB_OUTPUT"
          mkdir -p target/release
          cp target/retry/release-build.json target/release/release-build.json
      - name: Validate no-op result
        if: github.event_name == 'push' && steps.release_please.outputs.release_created != 'true' && steps.release_please.outputs.prs_created != 'true'
        run: echo 'No new release or release PR is needed.'

  source-bundle:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
      - name: Verify the tag commit
        env:
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ needs.release.outputs.sha }}
          BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          python3 scripts/release-run.py verify --metadata <(python3 - "$TAG" "$SHA" "$VERSION" "$BUILD_NUMBER" <<'PY'
          import json,sys
          tag,sha,version,number=sys.argv[1:]
          print(json.dumps({'tag':tag,'source_commit':sha,'version':version,'build_number':int(number)}))
          PY
          ) --tag "$TAG" --commit "$SHA"
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          cargo --version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Cache source-resolution downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/go/pkg/mod
            ~/.cache/go-build
          key: source-bundle-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packages/ai-provider/relaykit-bridge/go.mod', 'packages/ai-provider/relaykit-bridge/go.sum', 'app/mac/Licenses/Tunwg/UPSTREAM.json') }}
      - name: Create the exact-tag source bundle
        env:
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ needs.release.outputs.sha }}
          BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
          VERSION: ${{ needs.release.outputs.version }}
          SOURCE_PLATFORMS: ${{ needs.release.outputs.source_platforms }}
        run: |
          set -euo pipefail
          read -r -a platforms <<<"$SOURCE_PLATFORMS"
          python3 scripts/create-source-bundle.py --tag "$TAG" --commit "$SHA" --platforms "${platforms[@]}" --output-dir target/source
          archives=(target/source/*.tar.gz)
          [[ "${#archives[@]}" == 1 && -s "${archives[0]}" ]]
          archive=${archives[0]}
          python3 scripts/package-release.py source --input "$archive" --output-dir target/release \
            --tag "$TAG" --version "$VERSION" --commit "$SHA" --build-number "$BUILD_NUMBER" --arch all
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: target/release/*
          if-no-files-found: error
          retention-days: 2

  platform-builds:
    needs: [release, source-bundle]
    if: needs.release.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      VELUNE_BUILD_JOBS: 2
      VELUNE_BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
      - name: Verify tag, source SHA, and product version
        env:
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ needs.release.outputs.sha }}
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          [[ "$(git rev-parse "$TAG^{commit}")" == "$SHA" ]]
          [[ "$(python3 scripts/version.py --format full)" == "$VERSION" ]]
          python3 scripts/version.py --format build-number --build-number "$VELUNE_BUILD_NUMBER" >/dev/null
      - name: Cache native tool outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/host-rust
            target/cross-rust
            target/build-tools
            target/tools
            .build
            ~/.gradle/caches
          key: velune-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'Package.resolved', 'app/android/gradle/libs.versions.toml', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Set up Node.js
        if: matrix.platform == 'macos'
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: packages/agent-runtime/runtime-support/package-lock.json
      - name: Select Xcode 26.3
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcode_version=$(xcodebuild -version)
          printf '%s\n' "$xcode_version"
          [[ "${xcode_version%%$'\n'*}" == 'Xcode 26.3' ]]
      - name: Set up Go
        if: matrix.platform == 'macos'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - name: Set up Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
      - name: Install Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.14904198'
      - name: Set up Rust Android target
        if: matrix.platform == 'android'
        run: rustup target add aarch64-linux-android
      - name: Install runtime support and xURL
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-runtime-support.sh
          bash scripts/install-xurl.sh
      - name: Build and package macOS app
        if: matrix.platform == 'macos'
        env:
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ needs.release.outputs.sha }}
          VERSION: ${{ needs.release.outputs.version }}
          VELUNE_CODESIGN_IDENTITY: '-'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-macos.sh --profile release --purpose daily --build-only
          python3 scripts/package-release.py macos --input target/macos/Velune.app --output-dir target/release \
            --tag "$TAG" --version "$VERSION" --commit "$SHA" --build-number "$VELUNE_BUILD_NUMBER" --arch '${{ matrix.architecture }}'
      - name: Prepare fixed Android release keystore
        if: matrix.platform == 'android'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo 'ANDROID_RELEASE_KEYSTORE_BASE64 is missing' >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/velune-release.p12"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key"
          test -s "$key"
          chmod 600 "$key"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
      - name: Build, sign, and verify Android APK
        if: matrix.platform == 'android'
        env:
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ needs.release.outputs.sha }}
          VERSION: ${{ needs.release.outputs.version }}
          VELUNE_REQUIRE_ANDROID_RELEASE_SIGNING: 'true'
          ANDROID_CERTIFICATE: ${{ needs.release.outputs.android_certificate }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "$name is missing" >&2; exit 1; }
          done
          [[ "$ANDROID_RELEASE_KEY_ALIAS" == velune ]]
          bash scripts/build-android.sh --profile release
          apk=app/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          export VELUNE_AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          [[ -x "$apksigner" ]] || { echo "Missing pinned verifier: $apksigner" >&2; exit 1; }
          mkdir -p target
          verification=target/android-apk-verification.txt
          if ! "$apksigner" verify --verbose --print-certs "$apk" > "$verification" 2>&1; then
            cat "$verification" >&2
            echo 'Android APK signature verification failed' >&2
            exit 1
          fi
          cat "$verification"
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$verification" | head -n 1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ "$cert" != "$ANDROID_CERTIFICATE" ]]; then
            echo "Unexpected Android signing certificate SHA-256: ${cert:-missing}" >&2
            exit 1
          fi
          python3 scripts/package-release.py android --input "$apk" --output-dir target/release \
            --tag "$TAG" --version "$VERSION" --commit "$SHA" --build-number "$VELUNE_BUILD_NUMBER" --arch arm64 \
            --certificate-sha256 "$cert"
      - name: Remove temporary Android signing key
        if: always() && matrix.platform == 'android'
        shell: bash
        run: rm -f "${RUNNER_TEMP:-/tmp}/velune-release.p12"
      - name: Preserve Android packaging failure evidence
        if: failure() && matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-packaging-diagnostics
          path: |
            target/android-apk-verification.txt
            app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: target/release/*
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [release, source-bundle, platform-builds]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Select the tagged source without changing the upload contract
        env:
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p target
          git show HEAD:scripts/release_assets.py > target/release_assets.py
          git checkout --detach "$SHA"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: target/release
          merge-multiple: true
      - name: Verify and publish exactly the release contract assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ needs.release.outputs.sha }}
          VERSION: ${{ needs.release.outputs.version }}
          BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          gh release download "$TAG" --pattern release-build.json --dir target/release
          python3 scripts/release-run.py verify --metadata target/release/release-build.json --tag "$TAG" --commit "$SHA"
          uploads=$(python3 target/release_assets.py prepare-upload --directory target/release \
            --tag "$TAG" --version "$VERSION" --commit "$SHA" --build-number "$BUILD_NUMBER")
          mapfile -t assets <<<"$uploads"
          gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -qx true
          gh release upload "$TAG" "${assets[@]}" --clobber
          actual=$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          expected=$(printf '%s\n' "${assets[@]##*/}" | LC_ALL=C sort)
          if [[ "$actual" != "$expected" ]]; then
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            exit 1
          fi
          gh release view "$TAG" --json body --jq '.body' > target/release-notes-current.md
          python3 scripts/release-notes.py --input target/release-notes-current.md --output target/release-notes.md --tag "$TAG"
          gh release edit "$TAG" --draft=false --notes-file target/release-notes.md
      - name: Create or reuse main-to-develop sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr_number" ]]; then
            gh pr create --base develop --head main --title "chore: 将 $TAG 发布提交同步回 develop" \
              --body "Release $TAG 已从 main 发布。此 PR 将版本基线和发布提交回流至 develop，请在下一次提升前合并。"
            pr_number=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')
          fi
