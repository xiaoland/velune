[package]
name = "velune-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/velune-ai", "crates/velune-ai-provider"]
resolver = "3"
