[workspace]
members = [
    "packages/ai", "packages/ai-provider", "packages/conversation",
    "packages/agent-runtime", "packages/gateway", "packages/application",
    "packages/bindings", "packages/telemetry", "packages/application-api", "packages/remote",
    "packages/test-support",
    "tools/bindgen",
]
exclude = ["third-party/iroh-mdns-address-lookup", "third-party/iroh"]
resolver = "3"

[patch.crates-io]
iroh = { path = "third-party/iroh" }

# Development and test builds (test inherits dev) keep line-level backtraces
# without full type/variable debug information. Full debugging is an explicit
# CARGO_PROFILE_DEV_DEBUG=2 invocation, not another permanent profile.
[profile.dev]
debug = 1

# Mesh acceptance exercises real Ed25519 verification at every hop under the
# normal request deadline. Keep the curve arithmetic at production speed.
[profile.test.package.curve25519-dalek]
opt-level = 3
