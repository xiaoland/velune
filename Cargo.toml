[package]
name = "velune-core"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
simulation = ["dep:rusqlite"]

[lib]
path = "core/src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "velune-core"
path = "app/host/src/main.rs"
required-features = ["simulation"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
velune-ai = { path = "core/ai" }
velune-ai-provider = { path = "core/ai-provider" }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "system-proxy"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "host"
path = "tests/host.rs"
required-features = ["simulation"]

[[test]]
name = "vertical"
path = "tests/vertical.rs"
required-features = ["simulation"]

[workspace]
members = ["core/ai", "core/ai-provider"]
resolver = "3"
